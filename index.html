const SEEN_KEY = 'brainbenders_seen';

function getSeenSet() {
  try {
    const raw = localStorage.getItem(SEEN_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch { return new Set(); }
}

function markSeen(id) {
  const seen = getSeenSet();
  seen.add(id);
  localStorage.setItem(SEEN_KEY, JSON.stringify([...seen]));
  updateSeenCount();
}

function resetSeen() {
  localStorage.removeItem(SEEN_KEY);
  updateSeenCount();
}

function updateSeenCount() {
  const seen = getSeenSet();
  const total = PUZZLES.length;
  const seenCount = seen.size;
  const unseen = total - seenCount;
  const el = document.getElementById('seenCount');
  const resetBtn = document.getElementById('resetSeenBtn');
  if (el) el.textContent = `${unseen} new / ${total} total`;
  if (resetBtn) resetBtn.style.display = seenCount > 0 ? 'block' : 'none';
}

function onUnseenToggle() {
  unseenOnlyMode = document.getElementById('unseenOnly').checked;
  updateSeenCount();
}

// ============================================================
//  SPEECH SYNTHESIS
// ============================================================
const synth = window.speechSynthesis;
const speakBadge = document.getElementById('speakingBadge');

let chosenVoice = null;
let speechRate = 0.93;
let allEnglishVoices = [];

function loadVoices() {
  const voices = synth.getVoices();

  // Filter out novelty/joke voices that aren't useful for reading
  const novelty = /\b(bad news|bahh|bells|boing|bubbles|cellos|wobble|albert|trinoids|whisper|zarvox|jester|organ|superstar|ralph)\b/i;
  allEnglishVoices = voices.filter(v => v.lang.startsWith('en') && !novelty.test(v.name));

  const select = document.getElementById('voiceSelect');
  if (!select || !allEnglishVoices.length) return;

  const prevValue = select.value;
  select.innerHTML = '';

  // Sort: prefer known good voices first
  const preferred = ['Samantha', 'Ava', 'Zoe', 'Allison', 'Karen', 'Moira', 'Tessa', 'Alex'];
  allEnglishVoices.sort((a, b) => {
    const aIdx = preferred.findIndex(n => a.name.includes(n));
    const bIdx = preferred.findIndex(n => b.name.includes(n));
    const aRank = aIdx >= 0 ? aIdx : 100;
    const bRank = bIdx >= 0 ? bIdx : 100;
    return aRank - bRank;
  });

  allEnglishVoices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.name} (${v.lang})`;
    select.appendChild(opt);
  });

  // Restore previous selection or default to first
  if (prevValue && prevValue < allEnglishVoices.length) {
    select.value = prevValue;
  } else {
    select.value = '0';
  }
  chosenVoice = allEnglishVoices[parseInt(select.value)] || null;
}

function onVoiceChange() {
  const select = document.getElementById('voiceSelect');
  const idx = parseInt(select.value);
  chosenVoice = allEnglishVoices[idx] || null;
}

function onSpeedChange() {
  const slider = document.getElementById('speedSlider');
  speechRate = parseFloat(slider.value);
  const label = document.getElementById('speedLabel');
  if (speechRate <= 0.7) label.textContent = 'Slow';
  else if (speechRate <= 0.85) label.textContent = 'Relaxed';
  else if (speechRate <= 1.0) label.textContent = 'Normal';
  else if (speechRate <= 1.15) label.textContent = 'Quick';
  else label.textContent = 'Fast';
}

function testVoice() {
  speak("Hey! Ready for some brain benders on this road trip?");
}

function speak(text, onEnd) {
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = speechRate;
  utter.pitch = 1.02;

  if (chosenVoice) utter.voice = chosenVoice;

  utter.onstart = () => speakBadge.classList.add('active');
  utter.onend = () => { speakBadge.classList.remove('active'); if (onEnd) onEnd(); };
  utter.onerror = () => speakBadge.classList.remove('active');
  synth.speak(utter);
}

function stopSpeaking() {
  synth.cancel();
  speakBadge.classList.remove('active');
}

// Load voices when available
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = loadVoices;
}
loadVoices();
setTimeout(loadVoices, 500);
setTimeout(loadVoices, 2000);

// ============================================================
//  SCREEN MANAGEMENT
// ============================================================
function showScreen(id) {
  stopSpeaking();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ============================================================
//  CATEGORY SELECTION
// ============================================================
function buildCategoryGrid() {
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = '';
  for (const [key, cat] of Object.entries(CATEGORIES)) {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (selectedCats.has(key) ? ' selected' : '');
    btn.innerHTML = `<span class="emoji">${cat.emoji}</span><span>${cat.name}</span>`;
    btn.onclick = () => {
      if (selectedCats.has(key)) {
        if (selectedCats.size > 1) selectedCats.delete(key);
      } else {
        selectedCats.add(key);
      }
      buildCategoryGrid();
    };
    grid.appendChild(btn);
  }
}

buildCategoryGrid();
updateSeenCount();

// ============================================================
//  GAME LOGIC
// ============================================================
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  const seen = getSeenSet();
  let pool = PUZZLES.filter(p => selectedCats.has(p.cat));
  if (unseenOnlyMode) {
    pool = pool.filter(p => !seen.has(p.id));
  }
  currentPuzzles = shuffle(pool.map(p => ({...p})));
  if (currentPuzzles.length === 0) {
    alert('No new questions left! Uncheck "New questions only" or reset seen questions.');
    return;
  }
  currentIndex = 0;
  score = 0;
  totalAnswered = 0;
  totalCorrect = 0;
  showScreen('game-screen');
  loadPuzzle();
}

function loadPuzzle() {
  const p = currentPuzzles[currentIndex];
  hintsUsed = 0;
  answerRevealed = false;

  document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
  document.getElementById('progressInfo').textContent =
    `Puzzle ${currentIndex + 1} of ${currentPuzzles.length}`;
  document.getElementById('catBadge').textContent =
    `${CATEGORIES[p.cat].emoji} ${CATEGORIES[p.cat].name}`;
  document.getElementById('diffStars').textContent =
    '★'.repeat(p.diff) + '☆'.repeat(3 - p.diff);
  document.getElementById('questionText').textContent = p.q;
  document.getElementById('hintArea').innerHTML = '';
  document.getElementById('answerArea').innerHTML = '';
  document.getElementById('hintAnswerBtns').style.display = 'grid';
  document.getElementById('resultBtns').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  updateHintBtn();

  // Auto-read the question
  speak(p.q);
}

function updateHintBtn() {
  const p = currentPuzzles[currentIndex];
  const remaining = p.hints.length - hintsUsed;
  const btn = document.getElementById('hintBtn');
  btn.textContent = remaining > 0 ? `Hint (${remaining} left)` : 'No Hints Left';
  btn.disabled = remaining === 0;
  btn.style.opacity = remaining === 0 ? 0.5 : 1;
}

function speakQuestion() {
  const p = currentPuzzles[currentIndex];
  speak(p.q);
}

function showHint() {
  const p = currentPuzzles[currentIndex];
  if (hintsUsed >= p.hints.length) return;

  const hint = p.hints[hintsUsed];
  hintsUsed++;

  const hintArea = document.getElementById('hintArea');
  const div = document.createElement('div');
  div.className = 'hint-box';
  div.textContent = `Hint ${hintsUsed}: ${hint}`;
  hintArea.appendChild(div);

  speak(`Hint ${hintsUsed}: ${hint}`);
  updateHintBtn();
}

function showAnswer() {
  const p = currentPuzzles[currentIndex];
  answerRevealed = true;
  markSeen(p.id);

  const answerArea = document.getElementById('answerArea');
  answerArea.innerHTML = `
    <div class="answer-box">
      <strong>Answer:</strong>
      ${p.answer}
      <br><button class="btn-speak-small" onclick="speak('${p.answer.replace(/'/g, "\\'")}')">Read Answer Aloud</button>
    </div>
  `;

  document.getElementById('hintAnswerBtns').style.display = 'none';
  document.getElementById('resultBtns').style.display = 'grid';

  speak(`The answer is: ${p.answer}`);
}

function markResult(gotIt) {
  totalAnswered++;
  if (gotIt) {
    totalCorrect++;
    // Score: 3 points base, minus 1 per hint used (min 1)
    const points = Math.max(1, 3 - hintsUsed);
    score += points;
  }
  document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
  document.getElementById('resultBtns').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  stopSpeaking();
  currentIndex++;
  if (currentIndex >= currentPuzzles.length) {
    showStats();
    return;
  }
  loadPuzzle();
}

function showStats() {
  const pct = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
  document.getElementById('statsCard').innerHTML = `
    <div class="stat-row"><span>Puzzles Attempted</span><span class="stat-value">${totalAnswered}</span></div>
    <div class="stat-row"><span>Got It Right</span><span class="stat-value">${totalCorrect}</span></div>
    <div class="stat-row"><span>Accuracy</span><span class="stat-value">${pct}%</span></div>
    <div class="stat-row"><span>Final Score</span><span class="stat-value">${score}</span></div>
  `;
  showScreen('stats-screen');
}

// Prevent accidental zoom on double-tap
document.addEventListener('dblclick', e => e.preventDefault());
</script>
</body>
</html>
